# Additive configuration; inspect only until gates and deployment authorization pass.
# docker compose -f docker-compose.yml -f docker-compose.workflow.yml config
services:
  api:
    environment:
      WORKFLOW_JS_ENABLED: "false"
      CONNECTION_ENCRYPTION_KEYS: ${CONNECTION_ENCRYPTION_KEYS:?Set independent secret-manager encryption keys}
      CONNECTION_ACTIVE_KEY_ID: ${CONNECTION_ACTIVE_KEY_ID:?Set active encryption key ID}
      OUTBOUND_ALLOWED_HOSTS: ${OUTBOUND_ALLOWED_HOSTS:-}
  queue-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - workflow_queue_data:/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 180M
  run-worker:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/run-worker"]
    # Explicit minimum secrets: no SMTP/JWT, env_file or Docker socket.
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_password_change_me}@postgres:5432/${POSTGRES_DB:-nexus}
      WORKFLOW_REDIS_URL: redis://queue-redis:6379
      WORKFLOW_QUEUE_NAME: nf-runs
      WORKFLOW_QUEUE_PREFIX: nf-runs
      RUN_WORKER_CONCURRENCY: ${RUN_WORKER_CONCURRENCY:-4}
      RUN_LEASE_MS: 15000
      RUN_RECOVERY_INTERVAL_MS: 1000
      WORKFLOW_HTTP_ALLOWED_HOSTS: ${WORKFLOW_HTTP_ALLOWED_HOSTS:-}
      WORKFLOW_JS_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=192"
    depends_on:
      postgres:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
    networks:
      - nexus-net
    deploy:
      resources:
        limits:
          memory: 256M
volumes:
  workflow_queue_data:
