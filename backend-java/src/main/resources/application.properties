server.address=127.0.0.1
server.port=19081
spring.application.name=nexusflow-control
spring.datasource.url=${NF_DB_URL}
spring.datasource.username=${NF_DB_USER}
spring.datasource.password=${NF_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.mvc.async.request-timeout=600000
server.tomcat.max-http-form-post-size=262144
server.error.include-message=never
logging.level.root=WARN
logging.level.io.nexusflow=INFO
